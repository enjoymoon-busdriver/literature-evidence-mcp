<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FolioHook · 寻章 — 本地知识库</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
  <script src="/static/connections.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">跳到主要内容</a>
  <div class="app">
    <aside class="sidebar" aria-label="资料库与导航">
      <div class="brand">
        <img src="/static/icon.png" alt="">
        <div><strong>FolioHook <span>· 寻章</span></strong><small>让每次引用，都有出处</small></div>
      </div>
      <div class="sidebar-label">我的文献库 <span id="library-count"></span></div>
      <label class="sr-only" for="library-select">切换文献库</label>
      <select id="library-select" disabled><option>正在读取…</option></select>
      <div class="library-actions">
        <button type="button" data-action="new-library">＋ 新建</button>
        <button type="button" data-action="manage-libraries">管理库</button>
      </div>
      <nav id="navigation">
        <button type="button" data-action="nav" data-page="documents"><span>▤</span> 文档 <b id="document-count"></b></button>
        <button type="button" data-action="nav" data-page="search"><span>⌕</span> 搜索</button>
        <button type="button" data-action="nav" data-page="versions"><span>◷</span> 版本历史</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-note"><i></i> 本机文献工作空间<small id="service-status">正在连接本机服务…</small></div>
        <button type="button" data-action="settings"><span>⚙</span> 全局设置</button>
        <button type="button" data-action="apps"><span>↗</span> 连接 AI 应用</button>
        <button type="button" data-action="help"><span>?</span> 帮助与入门</button>
      </div>
    </aside>
    <div class="surface">
      <header class="topbar">
        <div class="current-library"><span class="eyebrow">文献库</span><strong id="current-library">尚未选择</strong></div>
        <div class="version-context"><span>浏览 <b id="view-version">—</b></span><span>当前激活 <b id="active-version">—</b></span></div>
        <button class="primary" type="button" data-action="import">＋ 导入文档</button>
      </header>
      <div id="test-instance-banner" class="note-box" style="overflow-wrap:anywhere" role="status" hidden></div>
      <div id="historical-banner"></div>
      <div class="workspace">
        <main id="content" tabindex="-1" aria-live="polite"></main>
        <aside id="details" aria-label="文档详情" hidden></aside>
      </div>
      <footer class="statusbar"><span>资料与快照保存在本机</span><span id="footer-status">本地 BM25 搜索无需 AI Key</span></footer>
    </div>
  </div>
  <div id="document-menu" role="menu" aria-label="文档操作" hidden>
    <div id="document-menu-title"></div>
    <button type="button" role="menuitem" data-action="context-details">查看详情</button>
    <button type="button" role="menuitem" data-action="context-remove">从新版本中移除</button>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
