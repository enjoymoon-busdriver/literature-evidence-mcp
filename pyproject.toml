[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-evidence-mcp"
version = "0.1.0.dev0"
description = "Auditable local literature evidence snapshots and read-only retrieval."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.1.1,<3",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.32,<1",
  "starlette>=1.6,<2",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.12,<3",
]

[project.scripts]
literature-evidence = "literature_evidence_mcp.cli:main"
literature-evidence-mcp = "literature_evidence_mcp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
literature_evidence_mcp = ["static/*.css", "static/*.html", "static/*.js"]
